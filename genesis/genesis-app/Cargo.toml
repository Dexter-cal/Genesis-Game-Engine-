[package]
name        = "genesis-app"
version     = "0.1.0"
edition     = "2021"
description = "GENESIS Engine — Where Worlds Begin"

[[bin]]
name = "genesis"
path = "src/main.rs"

[[bin]]
name = "genesis-server"
path = "src/server.rs"

[[bin]]
name = "genesis-cli"
path = "src/cli.rs"

[dependencies]
tokio       = { version="1", features=["full"] }
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version="0.3", features=["env-filter"] }
serde       = { version="1", features=["derive"] }
serde_json  = "1"
toml        = "0.8"
clap        = { version="4", features=["derive","env"] }
chrono      = { version="0.4", features=["serde"] }
uuid        = { version="1", features=["v4"] }
ctrlc       = "3"
reqwest     = { version="0.11", features=["json"] }
walkdir     = "2"
dirs        = "5"
